<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOIR | Product Details</title>

<link rel="stylesheet" href="style.css?v=3.5">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<!-- ================= NAVBAR ================= -->
<header>
<nav>
<a href="index.html" class="logo">NOIR.</a>

<ul>
<li><a href="index.html">Home</a></li>
<li><a href="products.html">Products</a></li>
<li><a href="index.html#collections">Collections</a></li>
<li><a href="contact.html">Contact</a></li>
</ul>

<!-- Wishlist Link -->
<a href="wishlist.html" class="wishlist-icon" style="color:white; text-decoration:none; margin-left:auto; margin-right:20px; font-size:20px; position:relative; cursor:pointer;">
<i class="fas fa-heart"></i>
</a>

<!-- Cart Link -->
<a href="cart.html" class="cart-icon" style="color:white; text-decoration:none; margin-right:20px; font-size:20px; position:relative; cursor:pointer;">
<i class="fas fa-shopping-cart"></i>
<span class="cart-count">0</span>
</a>

<!-- Login/Profile -->
<div id="account-area">
<a href="login.html" id="loginButton" class="login-btn">Login</a>

<div id="profileMenu" style="display:none; position:relative;">
<div class="profile-icon">
<i class="fas fa-user"></i>
</div>

<div class="profile-dropdown">
  <div style="padding: 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; align-items: center; gap: 8px;">
    <div class="dropdown-avatar" style="width: 50px; height: 50px; border-radius: 50%; background: #222; border: 1.5px solid rgba(255,255,255,0.15); display: flex; justify-content: center; align-items: center; font-size: 20px; color: #fff;">
      <i class="fas fa-user"></i>
    </div>
    <h3 id="userName" style="color: #ffffff; font-size: 14px; font-weight: 600; margin: 4px 0 0 0;">Guest</h3>
    <p id="userEmail" style="color: #888888; font-size: 11px; margin: 0; word-break: break-all;">guest@email.com</p>
  </div>
  <a href="profile.html">👤 My Profile</a>
  <a href="orders.html">📦 Orders</a>
  <a href="wishlist.html">❤️ Wishlist</a>
  <a href="#">⚙ Settings</a>
  <a href="#" id="logoutBtn">🚪 Logout</a>
</div>
</div>
</div>

</nav>
</header>


<!-- ================= PRODUCT DETAILS ================= -->
<section class="product-page">
  <div class="product-container" id="productDetailContainer">
    <!-- Dynamic content will load here -->
  </div>
</section>


<!-- ================= RELATED PRODUCTS ================= -->
<section class="related">
  <h2>You May Also Like</h2>
  <div class="trend-grid" id="relatedProductsGrid">
    <!-- Dynamic related cards will load here -->
  </div>
</section>


<!-- ================= FOOTER ================= -->
<footer>
  <p class="copy">© 2026 NOIR Premium Store</p>
</footer>

<script src="script.js?v=3.5"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
    // Parse URL parameter
    const params = new URLSearchParams(window.location.search);
    const productId = params.get("id");
    
    if (!productId) {
        window.location.href = "products.html";
        return;
    }

    const allProducts = [...(window.PRODUCTS || [])];
    
    // Safely parse mock_user_products from localStorage
    let userProducts = [];
    try {
        const rawUserProducts = localStorage.getItem("mock_user_products");
        if (rawUserProducts) {
            const parsed = JSON.parse(rawUserProducts);
            if (Array.isArray(parsed)) {
                userProducts = parsed;
            }
        }
    } catch (e) {
        console.error("Error parsing user products: ", e);
    }
    
    // Format community products for uniform loading
    const formattedUserProducts = userProducts.filter(p => p && typeof p === 'object').map((p, idx) => ({
        id: "community_" + idx,
        name: p.name || "Community Item",
        category: "Community",
        tag: p.tag || "COMMUNITY",
        description: p.details || "",
        price: Number(p.sellingPrice) || 0,
        originalPrice: Number(p.originalPrice) || 0,
        rating: 5.0,
        reviewsCount: 1,
        images: [p.image || 'images/default-item.png'],
        delivery: "Free Delivery",
        stock: "In Stock",
        seller: p.seller || "Member",
        specs: {
            "Brand": "Custom Craft",
            "Seller": p.seller || "Member",
            "Condition": "Brand New",
            "Origin": "Community Created"
        }
    }));

    const totalCatalog = [...allProducts, ...formattedUserProducts];
    const product = totalCatalog.find(p => p.id.toString() === productId.toString());

    if (!product) {
        alert("Product not found!");
        window.location.href = "products.html";
        return;
    }

    // Set page title
    document.title = `NOIR | ${product.name}`;

    // Render Product Main Card details
    const detailContainer = document.getElementById("productDetailContainer");
    
    // Render thumbs
    let thumbsHtml = "";
    product.images.forEach(img => {
        thumbsHtml += `<img src="${img}" onclick="changeImage(this)" onerror="this.src='https://images.unsplash.com/photo-1531403009284-440f080d1e12?w=500'">`;
    });

    // Render specs list
    let specsTableRows = "";
    for (const [key, value] of Object.entries(product.specs || {})) {
        specsTableRows += `
        <tr style="border-bottom: 1px solid rgba(0,0,0,0.06);">
            <td style="padding: 10px 0; width: 130px; color: #777; font-weight: 500;">${key}</td>
            <td style="padding: 10px 0; color: #222;">${value}</td>
        </tr>
        `;
    }

    const discountPct = Math.round(((product.originalPrice - product.price) / product.originalPrice) * 100);
    const discountBadge = discountPct > 0 ? `<span class="discount" style="background:#ffaa00; color:#111; font-weight:600; padding:2px 8px; border-radius:4px; font-size:12px; margin-left:10px;">${discountPct}% OFF</span>` : "";

    let starsHtml = "";
    const fullStars = Math.floor(product.rating);
    for (let i = 0; i < 5; i++) {
        if (i < fullStars) starsHtml += "★";
        else starsHtml += "☆";
    }

    detailContainer.innerHTML = `
    <!-- IMAGE GALLERY -->
    <div class="product-gallery">
      <img id="mainImage" src="${product.images[0]}" alt="${product.name}" onerror="this.src='https://images.unsplash.com/photo-1531403009284-440f080d1e12?w=500'">
      <div class="thumbs">
        ${thumbsHtml}
      </div>
    </div>
    
    <!-- PRODUCT INFO -->
    <div class="product-details" style="text-align: left;">
      <span class="product-tag" style="background:rgba(0,0,0,0.05); padding:4px 10px; border-radius:4px; font-size:12px; font-weight:600; color:#111; text-transform:uppercase; letter-spacing:1px;">${product.tag || 'TRENDING'}</span>
      <h1 style="margin-top: 15px; font-size: 28px; line-height: 1.2; color:#111; font-weight: 700;">${product.name}</h1>
      
      <div class="rating" style="font-size: 14px; color:#ffaa00; margin: 10px 0 20px 0;">
        ${starsHtml} <span style="color:#555; margin-left:6px;">(${product.reviewsCount} Customer Reviews)</span>
      </div>
      
      <h2 style="font-size: 24px; font-weight:700; color:#000; margin-bottom:15px; display:flex; align-items:center;">
        ₹${product.price.toLocaleString("en-IN")} 
        <span class="old-price" style="font-size: 16px; text-decoration: line-through; color: #888; margin-left: 10px;">₹${product.originalPrice.toLocaleString("en-IN")}</span>
        ${discountBadge}
      </h2>
      
      <p style="font-size: 14.5px; color:#444; line-height:1.6; margin-bottom:20px;">
        ${product.description}
      </p>
      
      <p class="delivery" style="color: #27ae60; font-size: 13.5px; margin-bottom:8px; font-weight:500;">🚚 ${product.delivery}</p>
      <p class="stock" style="color: #2980b9; font-size: 13.5px; font-weight:500; margin-bottom:20px;">✔ ${product.stock}</p>

      <!-- PINCODE CHECKER -->
      <div class="pincode-container" style="margin: 15px 0 25px 0; padding: 16px; background: rgba(0,0,0,0.02); border: 1px dashed rgba(0,0,0,0.08); border-radius: 14px; width: 100%; max-width: 380px;">
        <p style="font-size: 13px; color: #555; margin: 0 0 10px 0; font-weight: 500;">
          <i class="fas fa-location-dot" style="color: #ffaa00; margin-right: 6px;"></i> Delivery Estimate:
        </p>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="pincodeInput" placeholder="Enter 6-digit Pincode" style="padding: 10px 14px; border: 1px solid rgba(0,0,0,0.1); border-radius: 8px; font-size: 13px; outline: none; flex: 1; background: #fff; color: #111;" maxlength="6">
          <button onclick="checkDeliveryPincode()" style="background: #111; color: #fff; padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer; font-size: 12.5px; font-weight: 600; transition: background 0.3s;">Check</button>
        </div>
        <p id="pincodeResult" style="font-size: 13px; font-weight: 500; margin: 12px 0 0 0; display: none;"></p>
      </div>
      
      <div style="display:flex; gap:15px; margin-bottom:35px; flex-wrap:wrap;">
        <button class="buy-btn" id="addToCartBtn" style="padding: 14px 28px; font-size:14.5px; font-weight:600;">
          <i class="fas fa-cart-shopping"></i> Add to Cart
        </button>
        <button class="wishlist-btn" id="addToWishlistBtn" style="background:rgba(0,0,0,0.04); border:1px solid rgba(0,0,0,0.1); color:#111; padding: 14px 28px; border-radius:12px; cursor:pointer; font-size:14.5px; font-weight:600; transition:all 0.3s;">
          <i class="fa-solid fa-heart"></i> Wishlist
        </button>
      </div>

      <!-- SPECS SECTION -->
      <div class="specs-section" style="margin-top: 30px; border-top: 1px solid rgba(0,0,0,0.08); padding-top: 20px; width: 100%;">
        <h3 style="font-size: 16px; color: #111; margin-bottom: 15px;">Product Specifications</h3>
        <table class="specs-table" style="width: 100%; border-collapse: collapse; font-size: 13.5px;">
          ${specsTableRows}
        </table>
      </div>
    </div>
    `;

    // Bind Add to Cart / Wishlist Actions
    document.getElementById("addToCartBtn").addEventListener("click", () => {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        const idx = cart.findIndex(item => item.name === product.name);
        if (idx !== -1) {
            cart[idx].qty += 1;
        } else {
            cart.push({
                name: product.name,
                price: product.price,
                image: product.images[0],
                qty: 1
            });
        }
        localStorage.setItem("cart", JSON.stringify(cart));
        
        // Sync cart count
        const count = cart.reduce((a, b) => a + b.qty, 0);
        document.querySelectorAll(".cart-count").forEach(b => b.innerText = count);
        
        if (window.showToast) window.showToast("🛒 Added to Cart!");
        else alert("🛒 Added to Cart!");
    });

    document.getElementById("addToWishlistBtn").addEventListener("click", (e) => {
        const heartIcon = e.currentTarget.querySelector("i");
        heartIcon.style.color = heartIcon.style.color === "red" ? "" : "red";
        
        let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
        const idx = wishlist.findIndex(item => item.name === product.name);
        
        if (idx !== -1) {
            wishlist.splice(idx, 1);
            if (window.showToast) window.showToast("💔 Removed from Wishlist");
        } else {
            wishlist.push({
                name: product.name,
                price: product.price,
                image: product.images[0]
            });
            if (window.showToast) window.showToast("❤️ Added to Wishlist");
        }
        localStorage.setItem("wishlist", JSON.stringify(wishlist));
    });

    // Render Related Products (same category)
    const relatedGrid = document.getElementById("relatedProductsGrid");
    const relatedItems = totalCatalog
        .filter(p => p.category === product.category && p.id.toString() !== product.id.toString())
        .slice(0, 3); // Get top 3

    if (relatedItems.length === 0) {
        relatedGrid.parentElement.style.display = "none";
    } else {
        relatedItems.forEach(item => {
            const itemCard = `
            <div class="product-card shadow-hover" onclick="window.location.href='product-details.html?id=${item.id}'" style="cursor:pointer;">
                <button class="wishlist-btn" onclick="event.stopPropagation(); toggleRelatedWishlist(event, '${item.id}')"><i class="fa-solid fa-heart"></i></button>
                <img src="${item.images[0]}" alt="${item.name}" onerror="this.src='https://images.unsplash.com/photo-1531403009284-440f080d1e12?w=500'">
                <div class="product-info" style="text-align:left;">
                    <h3 style="font-size:14.5px; color:#111; margin-top:8px; font-weight:600;">${item.name}</h3>
                    <p style="font-weight:600; color:#000; margin-top:5px;">₹${item.price.toLocaleString("en-IN")}</p>
                    <button class="buy-btn" onclick="event.stopPropagation(); handleAddToCart(event, '${item.id}')" style="margin-top:10px; width:100%;">Add to Cart</button>
                </div>
            </div>
            `;
            relatedGrid.insertAdjacentHTML("beforeend", itemCard);
        });
    }

    // Helper functions for related clicks
    window.toggleRelatedWishlist = function(event, id) {
        const heartIcon = event.currentTarget.querySelector("i");
        heartIcon.style.color = heartIcon.style.color === "red" ? "" : "red";
        
        let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
        const item = totalCatalog.find(p => p.id.toString() === id.toString());
        
        if (item) {
            const idx = wishlist.findIndex(x => x.name === item.name);
            if (idx !== -1) {
                wishlist.splice(idx, 1);
            } else {
                wishlist.push({
                    name: item.name,
                    price: item.price,
                    image: item.images[0]
                });
            }
            localStorage.setItem("wishlist", JSON.stringify(wishlist));
        }
    };
});

function changeImage(img) {
    document.getElementById("mainImage").src = img.src;
}

function checkDeliveryPincode(pincode = null) {
  const input = document.getElementById("pincodeInput");
  const result = document.getElementById("pincodeResult");
  const pin = pincode || (input ? input.value.trim() : "");
  
  if (!pincode && input) {
    input.value = pin;
  }
  
  if (!/^\d{6}$/.test(pin)) {
    if (result) {
      result.style.display = "block";
      result.style.color = "#d9534f";
      result.innerText = "❌ Please enter a valid 6-digit pincode.";
    }
    return;
  }
  
  // Calculate delivery date based on pincode prefix
  const firstDigit = pin[0];
  let days = 3;
  if (firstDigit === '1' || firstDigit === '2') {
    days = 1; // North
  } else if (firstDigit === '3' || firstDigit === '4') {
    days = 2; // West/Central
  } else if (firstDigit === '5' || firstDigit === '6') {
    days = 3; // South
  } else {
    days = 4; // East/Northeast
  }
  
  const options = { weekday: 'long', month: 'short', day: 'numeric' };
  const deliveryDate = new Date();
  deliveryDate.setDate(deliveryDate.getDate() + days);
  const dateString = deliveryDate.toLocaleDateString("en-IN", options);
  
  if (result) {
    result.style.display = "block";
    result.style.color = "#27ae60";
    if (days === 1) {
      result.innerHTML = `🚀 <strong>Express Delivery:</strong> Tomorrow (${dateString})`;
    } else {
      result.innerHTML = `🚚 <strong>Standard Delivery:</strong> In ${days} days (${dateString})`;
    }
  }
  
  // Save pincode locally to persist across sessions
  localStorage.setItem("userPincode", pin);
}

// Auto-check saved pincode on page load
document.addEventListener("DOMContentLoaded", () => {
  const savedPin = localStorage.getItem("userPincode") || localStorage.getItem("temp_pincode");
  if (savedPin) {
    checkDeliveryPincode(savedPin);
  }
});
</script>

</body>
</html>
