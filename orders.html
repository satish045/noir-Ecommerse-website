<!-- ================= ORDERS SCRIPT ================= -->
<script>
function loadOrders() {
    let orders = JSON.parse(localStorage.getItem("orders")) || [];
    let container = document.getElementById("ordersContainer");

    container.innerHTML = "";

    if (orders.length === 0) {
        container.innerHTML = `
            <div class="glass" style="text-align:center; padding: 50px; border-radius: 20px; background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1);">
                <h2 style="color:#777; font-weight: 500;">
                    📦 No orders placed yet
                </h2>
                <p style="color:#aaa; margin-top:10px;">Browse our collections and place an order to see it here.</p>
                <a href="products.html" class="buy-btn" style="display:inline-block; margin-top:20px; text-decoration:none; text-align:center;">Shop Now</a>
            </div>
        `;
        return;
    }

    orders.reverse().forEach(order => {
        const orderStatus = order.status || "Processing";
        container.innerHTML += `
        <div class="product-card shadow-hover glass" style="padding: 30px; border-radius: 20px; background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); width: 100%; position: relative;">
            <div class="product-info" style="width: 100%;">
                <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:15px; margin-bottom:15px; flex-wrap: wrap; gap: 10px;">
                    <h3>Order #${order.id}</h3>
                    <span style="color:${orderStatus === "Cancelled" ? "#d9534f" : "#2ecc71"}; font-weight:600; background:${orderStatus === "Cancelled" ? "rgba(217,83,79,0.1)" : "rgba(46,204,113,0.1)"}; padding:5px 15px; border-radius:20px; font-size:14px;">
                        ${orderStatus === "Cancelled" ? "🔴 Status: Cancelled" : "🟢 Status: Processing"}
                    </span>
                </div>
                <p style="margin: 8px 0;"><b>Name:</b> ${order.name}</p>
                <p style="margin: 8px 0;"><b>Delivery Address:</b> ${order.address}</p>
                <p style="margin: 8px 0;"><b>Order Date:</b> ${order.date}</p>

                <hr style="border:none; border-top: 1px dashed rgba(255,255,255,0.1); margin:15px 0;">

                <h4>Items Ordered:</h4>
                <div style="margin: 10px 0;">
                ${order.items.map(item => `
                    <div style="display:flex; justify-content:space-between; margin: 8px 0; color:#ccc; font-size:14px;">
                        <span>• ${item.name} (x${item.qty})</span>
                        <span>₹${item.price * item.qty}</span>
                    </div>
                `).join("")}
                </div>

                <hr style="border:none; border-top: 1px solid rgba(255,255,255,0.1); margin:15px 0;">

                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h3>Total Amount:</h3>
                    <h2 style="color:#fff;">₹${order.total}</h2>
                </div>

                ${orderStatus !== "Cancelled" ? `
                <div style="text-align:right; margin-top:20px;">
                    <button class="buy-btn" onclick="cancelOrder(${order.id})" style="background:#d9534f; border:none; padding:8px 20px; font-size:13px; font-weight:600; border-radius:30px; cursor:pointer; color:#fff; width:auto;">
                        Cancel Order
                    </button>
                </div>
                ` : ""}
            </div>
        </div>
        `;
    });
}

function cancelOrder(orderId) {
    if (!confirm("Are you sure you want to cancel this order?")) return;
    
    let orders = JSON.parse(localStorage.getItem("orders")) || [];
    const idx = orders.findIndex(o => o.id === orderId);
    
    if (idx !== -1) {
        orders[idx].status = "Cancelled";
        localStorage.setItem("orders", JSON.stringify(orders));
        loadOrders();
        showToast("🔴 Order Cancelled successfully");
    }
}

function clearOrders() {
    if (!confirm("Are you sure you want to clear all orders?")) return;
    localStorage.removeItem("orders");
    loadOrders();
}

document.addEventListener("DOMContentLoaded", loadOrders);
</script>
