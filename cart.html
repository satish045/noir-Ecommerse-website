<!-- ================= CART SECTION ================= -->
<section class="cart-page">

<h1 class="text-center mt-40">Your Shopping Cart</h1>

<div class="cart-container" id="cartContainer">

<!-- Items will load here -->

</div>

<!-- TOTAL -->
<div class="cart-summary">

<h2>Total</h2>

<h1 id="cartTotal">₹0</h1>

<button class="buy-btn" id="checkoutBtn">
Proceed to Checkout
</button>

</div>

</section>

<script src="script.js?v=3.5"></script>

<!-- ================= CART RENDER SCRIPT ================= -->
<script>
function renderCart() {

    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    let container = document.getElementById("cartContainer");
    let totalEl = document.getElementById("cartTotal");

    container.innerHTML = "";

    let total = 0;

    if (cart.length === 0) {
        container.innerHTML = `
            <h2 style="text-align:center; color:#777; margin-top:50px;">
                🛒 Your cart is empty
            </h2>
        `;
        totalEl.innerText = "₹0";
        return;
    }

    cart.forEach((item, index) => {

        total += item.price * item.qty;

        container.innerHTML += `
        <div class="product-card shadow-hover">

            <img src="${item.image}" alt="product">

            <div class="product-info">

                <h3>${item.name}</h3>

                <p>Price: ₹${item.price}</p>

                <div class="flex align-center mt-20">

                    <button onclick="decreaseQty(${index})">-</button>

                    <span style="margin:0 10px;">${item.qty}</span>

                    <button onclick="increaseQty(${index})">+</button>

                </div>

                <button onclick="removeItem(${index})" class="buy-btn" style="margin-top:15px;background:red;">
                    Remove
                </button>

            </div>
        </div>
        `;
    });

    totalEl.innerText = "₹" + total;

    // update badge
    document.querySelector(".cart-count").innerText = cart.reduce((a,b)=>a+b.qty,0);
}

function increaseQty(i) {
    let cart = JSON.parse(localStorage.getItem("cart"));
    cart[i].qty++;
    localStorage.setItem("cart", JSON.stringify(cart));
    renderCart();
}

function decreaseQty(i) {
    let cart = JSON.parse(localStorage.getItem("cart"));

    if (cart[i].qty > 1) {
        cart[i].qty--;
    } else {
        cart.splice(i, 1);
    }

    localStorage.setItem("cart", JSON.stringify(cart));
    renderCart();
}

function removeItem(i) {
    let cart = JSON.parse(localStorage.getItem("cart"));
    cart.splice(i, 1);
    localStorage.setItem("cart", JSON.stringify(cart));
    renderCart();
}

document.addEventListener("DOMContentLoaded", () => {
    renderCart();
    
    const checkoutBtn = document.getElementById("checkoutBtn");
    if (checkoutBtn) {
        checkoutBtn.addEventListener("click", () => {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            if (cart.length === 0) {
                alert("🛒 Your cart is empty!");
                return;
            }
            const isLoggedIn = localStorage.getItem("loggedIn") === "true";
            if (!isLoggedIn) {
                alert("🔒 Please login to proceed to checkout.");
                window.location.href = "login.html";
                return;
            }
            window.location.href = "checkout.html";
        });
    }
});
</script>
