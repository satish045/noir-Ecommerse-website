<!-- ================= WISHLIST SECTION ================= -->
<section class="wishlist-page">

<h1 class="text-center mt-40">❤️ Your Wishlist</h1>

<div class="trend-grid" id="wishlistContainer">

<!-- Wishlist items will load here -->

</div>

</section>

<script src="script.js?v=3.5"></script>

<!-- ================= WISHLIST SCRIPT ================= -->
<script>

function loadWishlist() {

    let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
    let container = document.getElementById("wishlistContainer");

    container.innerHTML = "";

    if (wishlist.length === 0) {
        container.innerHTML = `
            <h2 style="text-align:center; color:#777; margin-top:50px;">
                ❤️ Your wishlist is empty
            </h2>
        `;
        return;
    }

    wishlist.forEach((item, index) => {
        let name = typeof item === 'string' ? item : item.name;
        let price = (item && item.price) ? item.price : "₹4,999";
        let image = (item && item.image) ? item.image : "https://images.unsplash.com/photo-1542291026-7eec264c27ff";

        container.innerHTML += `
        <div class="product-card shadow-hover glass" style="position: relative; overflow: hidden; border-radius: 22px;">

            <button class="wishlist-btn active" style="z-index: 10;" onclick="removeItem(${index}); event.stopPropagation();">
                <i class="fa-solid fa-heart"></i>
            </button>

            <img src="${image}" alt="${name}">

            <div class="product-info" style="padding: 20px;">

                <h3 style="margin-top: 10px;">${name}</h3>

                <div class="price" style="font-size: 20px; font-weight: 700; margin: 10px 0 15px 0;">${price}</div>

                <button class="buy-btn" style="width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px;" onclick="addFromWishlistToCart('${name.replace(/'/g, "\\'")}', '${price}', '${image}')">
                    <i class="fas fa-cart-shopping"></i> Add to Cart
                </button>

            </div>

        </div>
        `;
    });
}

function removeItem(i) {
    let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
    wishlist.splice(i, 1);
    localStorage.setItem("wishlist", JSON.stringify(wishlist));
    loadWishlist();
}

function addFromWishlistToCart(name, priceText, image) {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    let price = parseInt(priceText.replace(/[^0-9]/g, "")) || 0;
    
    const existing = cart.find(p => p.name === name);
    if (existing) {
        existing.qty++;
    } else {
        cart.push({
            name: name,
            price: price,
            image: image,
            qty: 1
        });
    }
    localStorage.setItem("cart", JSON.stringify(cart));
    
    // Update navbar badges immediately
    const badges = document.querySelectorAll(".cart-count");
    const count = cart.reduce((a, b) => a + b.qty, 0);
    badges.forEach(badge => {
        badge.innerText = count;
    });

    if (typeof window.showToast === 'function') {
        window.showToast("🛒 Added to Cart");
    } else {
        alert("🛒 Added to Cart");
    }
}

document.addEventListener("DOMContentLoaded", loadWishlist);

</script>

</body>
